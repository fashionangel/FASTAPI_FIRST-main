<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-fx" aria-hidden="true"></div>
<input type="checkbox" id="theme" class="theme-switch">
<label for="theme" class="theme-btn" title="Сменить тему"></label>

<div class="card">
    <div class="logo">🌿</div>
    <h2>Мой <span class="grad-text">Сайт</span></h2>
    <p class="subtitle">Мини-соцсеть на FastAPI + Jinja2</p>

    <div class="features">
        <span class="pill">📸 Фото и видео</span>
        <span class="pill">🎠 Карусель фото</span>
        <span class="pill">💬 Комментарии</span>
        <span class="pill">🌗 Тёмная тема</span>
    </div>

    <div class="actions">
        <a class="btn ghost" href="/login">Войти</a>
        <a class="btn" href="/register">Регистрация</a>
    </div>
</div>

<script>
    (function () {
        const t = document.getElementById('theme');
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
            t.checked = true;
        }
        t.addEventListener('change', function () {
            localStorage.setItem('theme', t.checked ? 'dark' : 'light');
        });
    })();
</script>

</body>
</html>
