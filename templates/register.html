<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<input type="checkbox" id="theme" class="theme-switch">
<label for="theme" class="theme-btn" title="Сменить тему">🌓</label>

<div class="card">
    <div class="logo">🎉</div>
    <h2>Создать аккаунт</h2>
    <p class="subtitle">Пара шагов — и вы с нами</p>

    {% if error %}
        <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/register" enctype="multipart/form-data" class="form">
        <label>Логин
            <input type="text" name="username" required
                   autocomplete="username" value="{{ username }}" placeholder="придумайте логин">
        </label>
        <label>Пароль
            <input type="password" name="password" required
                   autocomplete="new-password" placeholder="придумайте пароль">
        </label>
        <label>Аватарка <span class="optional">(необязательно)</span>
            <input type="file" name="avatar" accept=".png,.jpg,.jpeg,.webp">
        </label>
        <p class="note">PNG / JPG / WEBP, до 2 МБ</p>
        <button class="btn wide" type="submit">Зарегистрироваться</button>
    </form>

    <p class="hint">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>

</body>
</html>
