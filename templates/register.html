<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>Регистрация</h2>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/register" enctype="multipart/form-data">
            <div class="form-group">
                <input type="text" name="username" placeholder="Имя пользователя" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Пароль" required>
                <label class="checkbox-label">
                    <input type="checkbox" id="show-password"> Показать пароль
                </label>
            </div>

            <div class="form-group">
                <label for="avatar">Фото профиля (необязательно):</label><br>
                <input type="file" id="avatar" name="avatar" accept=".png,.jpg,.jpeg,.webp,image/*">
                <br>
                <img id="avatar-preview" alt="Предпросмотр аватара" style="display:none; width:150px; height:150px; object-fit:cover; border-radius:50%; margin-top:10px;">
            </div>

            <button type="submit">Зарегистрировать</button>
        </form>

        <button type="button" id="theme-btn">Сменить тему</button>
    </div>

    <script>
        // Показ и скрытие пароля
        document.getElementById("show-password").addEventListener("change", function () {
            const passwordInput = document.getElementById("password");
            passwordInput.type = this.checked ? "text" : "password";
        });

        // Переключение темной темы
        document.getElementById("theme-btn").addEventListener("click", function () {
            document.body.classList.toggle("dark");
        });

        // Превью выбранного фото
        document.getElementById("avatar").addEventListener("change", function () {
            const preview = document.getElementById("avatar-preview");
            
            if (preview.src) {
                URL.revokeObjectURL(preview.src);
            }

            if (this.files && this.files[0]) {
                preview.src = URL.createObjectURL(this.files[0]);
                preview.style.display = "inline-block";
            } else {
                preview.src = "";
                preview.style.display = "none";
            }
        });
    </script>
</body>
</html>
