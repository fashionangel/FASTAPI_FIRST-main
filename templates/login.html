<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-fx" aria-hidden="true"></div>
<input type="checkbox" id="theme" class="theme-switch">
<label for="theme" class="theme-btn" title="Сменить тему"></label>

<div class="card">
    <div class="logo">🔐</div>
    <h2>С возвращением!</h2>
    <p class="subtitle">Войдите в свой аккаунт</p>

    {% if error %}
        <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="form">
        <label>Логин
            <input type="text" name="username" required
                   autocomplete="username" value="{{ username }}" placeholder="введите логин">
        </label>
        <label>Пароль
            <input type="password" name="password" required
                   autocomplete="current-password" placeholder="введите пароль">
        </label>
        <button class="btn wide" type="submit">Войти</button>
    </form>

    <p class="hint">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</div>

<script>
    (function () {
        const t = document.getElementById('theme');
        const saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
            t.checked = true;
        }
        t.addEventListener('change', function () {
            localStorage.setItem('theme', t.checked ? 'dark' : 'light');
        });
    })();
</script>

</body>
</html>
